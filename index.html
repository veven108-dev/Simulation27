<!-- CHANGELOG v4.0 "Samrajya"
MODE     Samrajya (the default mode): Trishula in hand from the first frame, every astra and siddhi, a Treasury of 10,000 pana, bottomless inventory; no hunger, thirst, breath or fall death; lethal blows leave you at 1 HP ("You have been tested. Rise.").
RTA      Rta, the cosmic order (-100 to +100): a rotating dharma-chakra at the top of the screen, indigo to white to gold, spinning with its magnitude, pulsing red below -40, singing faintly above +80.
RTA      Moved by deeds: wars (-2 per day), deaths among the people, temples destroyed, forests burned, innocent creatures and sacred cows harmed, catastrophes summoned, Brahmastra and Pashupatastra, breaches; wars ended (+15), treaties (+10), quests (+5), raids repelled (+4), restoration (+2 each), a Kalpavriksha planted (+5), a day without deaths (+1).
RTA      Consequences: above +80 no wars start, the sky stays kind and dragons stay home; below 0 storms, bandits and more raids; below -40 omens (comets, blood moons, eclipses); below -80 Pralaya: the seas rise for ten days and the sky burns; restore Rta to +50 or the age ends and a new one begins.
CHAKRA   The Chakra of Creation (Tab, three-finger tap, or the CHAKRA button): eight spokes - Terrestrial (every block), Living, Divine, Celestial, Underworld, Weather, Trees, Building. Everything appears where the crosshair points.
LIVING   57 spawnable beings; 35 new: rhino, snow leopard, lion, wild elephant, gaur, crocodile, gharial, king cobra, Ganges shark, Uchchaihshravas (seven heads, winged), Gandharva, Kinnara, Vidyadhara, Yaksha, Purusha-Mriga, Yali, Sarabha (eight legs), Kurma, Matsya, Rukh, Narasimha, Varaha, Hayagriva, Vamana (grows to eighteen times his height), Kalki, Vanara warrior, Jambavan, Rakshasa lord, Asura chieftain, Kumbhakarna (asleep until struck), Danava, Daitya, Kalakeya, Nivata-Kavacha, Pishacha (unseen in darkness), Churel, Vetala, Kumbhanda, Kirtimukha. Spawn one, a herd, a pack or an army.
LIVING   Avatars and Vanara allies follow you and fight whatever threatens you; they can never be harmed (Reverence Protocol).
DIVINE   New astras: Narayanastra (one arrow for every armed enemy), Pashupatastra (three detonations, Rta -20), Sudarshana Chakra (a disc that seeks ten foes and returns). New siddhis: Kalachakra (the world slows, you do not), Akasha-Gamana (instant travel to cities, Svarga, wars and breaches), Rupa-Parivartana (take the form of a tiger, elephant, Garuda, lion, Narasimha, Jambavan or Vanara).
WEATHER  Fourteen commandable events with radius (25-5000u) and intensity (1-10), each acting on the world: monsoon fronts that raise rivers and drain afterwards, thunderstorms whose bolts strike the highest point and start fires, tornadoes that lift creatures, the player, blocks and items, blizzards that freeze water and lay snow, volcanoes that raise a basalt cone with a lava vent that flows downhill and lob burning bombs, dust storms that erode sandstone, fog banks that muffle sound, hail that injures and strips leaves, solar and lunar eclipses, meteor showers that crater, aurora, rainbows, and Pralaya itself.
TREES    Megafossil trees placed by seed: Kalpavriksha Prime near Ayodhya with a Bodhi-tree ringed by 108 trees within 200u, 3 Meru-vriksha in the Himalaya (hollow trunk with a spiral stair), 5 Akshaya-vata in the Dandakaranya with aerial-root trunks, 20 Samudra-taru along rivers dripping water into pools, Nagalinga, Chintamani (gem leaves), 12 Amrita-valli coils. Up to 240u tall; vines spiral the trunks for climbing; a gold shrine crowns each canopy; guardians appear when you approach and rise if you burn the tree; seen from 5 km as silhouettes.
TREES    Spawn any of the eight from the Chakra: it pushes up through the earth over sixty seconds. Trees are stored as landmarks, not as saved chunks, so they cost almost nothing in storage.
BUILD    Fifteen buildings placed whole and walkable at once: hut, townhouse, haveli, shikhara temple, palace, city wall, gopuram gate, watchtower, stepwell, granary, akhaara, gurukul, ashram, bridge, port jetty; undo the last eight.
WAR      Dynasties hold relations (-100 to +100) that fall with crowded borders, insults and low Rta, and rise with distance, truces and high Rta. Below -60: the brink. Below -80: war is declared.
WAR      A declaration triggers a full-screen scroll with both emblems, the war's name and place, a triple warning bell, a red compass marker, a Journal quest and the Guardian Angel's warning.
WAR      War Portal (Divine spoke): a golden torana to the nearest war. Battles field infantry, archers, war elephants, siege engines and a general per side; morale breaks a host below 30%.
PEACE    Peace Mode: hold T (or the middle mouse button, or the PEACE touch button) with the Trishula for 1.2 s. Every soldier within 50u lays down arms for 60 s; right-click a general to choose a treaty (territorial concession, marriage alliance or hostage exchange).
PEACE    Turning on both hosts costs Rta -40 and twenty days of hatred. Every war that ends raises a 20u pillar at the battlefield naming who ended it (right-click to read).
GODS     Wars that last two days draw two gods (Indra, Agni, Varuna, Vayu, Yama, Kubera) who fight each other with lightning, fire, flood, wind, death and bribed soldiers while the armies stop to watch. The Trishula can wound them; wounded gods withdraw (Rta -10). Below Rta -60, Vishnu descends and every knee bends; the war ends.
PATALA   The underworld is at perpetual war: nagas against danavas, daityas, kalakeyas and nivata-kavachas, with its own Naga-Rta meter. When it goes badly, a breach opens near a surface city: an obsidian and lava rift that spills creatures and marches on the city after an hour. Seal it by meditating (Y) beside it with the Trishula for ten seconds, or step into it to descend.
PATALA   Passage Stone (Underworld spoke): a permanent two-way rift; occasionally something climbs out.
PHYSICS  Structural collapse: when blasts remove support, blocks above fall as rubble and pile where they land. Tornado wind fields lift bodies and debris.
CHRONICLE A scroll of the reign: days kept, wars ended and by treaty, breaches sealed, trees raised, raids broken, falls into chaos.
TOUCH    CHAKRA and PEACE buttons on the thumb grid; three-finger tap opens the Chakra, two-finger tap closes it.
NOT DONE Rigid-body GJK/EPA solver, ragdolls, SPH fluids and heat simulation; armies of hundreds (about 35 per side keep phones at frame rate); trees above 250u (world height); creature preview portraits; per-creature skinning shaders (creatures use the shared voxel rig); Shiva and Durga interventions.

<!-- CHANGELOG v3.1 "Mobile Ascension"
MOBILE   Device detection at boot: user agent, deviceMemory, hardwareConcurrency, unmasked GPU string (Adreno / Mali / Immortalis / Xclipse / PowerVR / Apple) and a hidden-context GPU benchmark (bails out early on slow GPUs).
MOBILE   Four tiers (S / A / B / C) chosen from GPU family, capped by benchmark and memory; stored in localStorage; overridable in Settings > Device tier (Auto, S, A, B, C, Desktop). Desktop keeps the v3 renderer.
MOBILE   Tier S: TAA, GTAO + SSR, volumetric light, 2 cascades at 1536, DPR 1.5, 10 chunks. A: FXAA, 2 cascades at 1024, no SSR/AO, DPR 1.25, 8 chunks. B: FXAA, 1 cascade, no volumetrics, DPR 1.0, 6 chunks. C: no shadows, DPR 0.75, 4 chunks, 30 fps target.
MOBILE   Dynamic resolution: rolling 60-frame window of real frame intervals; -10% when frames run long, +5% when on target, 10 s lock-out and a slowly decaying ceiling so it does not oscillate against vsync; 0.5x-1.5x; UI stays at native resolution.
MOBILE   Tier-scaled particle budget (100 / 60 / 30 / 30%) and waterfall droplets (16k / 9k / 4k / 2k per fall).
GPU      Half-float HDR on devices exposing only EXT_color_buffer_half_float (previously fell back to 8-bit).
GPU      Depth prepass (colour writes off, then LEQUAL shading) enabled automatically on Adreno, where it feeds LRZ; left off on Mali and PowerVR, which remove hidden pixels in hardware.
GPU      Svarga's 553 sky chunks merged into 16 region meshes; draws over 65,536 vertices use one 32-bit indexed call; region-aware frustum and shadow culling. Island draw calls fall from hundreds to tens (desktop benefits too).
RENDER   FXAA-style edge filter in the composite pass for tiers without TAA.
RENDER   Contact shadows: soft darkening discs under the player and nearby bodies, one instanced multiply-blended draw.
RENDER   Rain splashes on surfaces within 10u of the player on tiers S and A (and desktop).
TOUCH    Floating left joystick (push hard forward to sprint), right-side swipe look, quick tap on the right side = use/talk.
TOUCH    Right-thumb grid: Jump, Strike, Use, Down, Fly, Sprint (toggle), Astra, Siddhi, Bag, Pause, More; More opens Map, Camera, Vahana, Angel guide, Meditate, Astra next, Siddhi next, Journal, Portal, Waypoint.
TOUCH    Tap the hotbar to select a slot; minimap hidden in touch mode; controls hide whenever a menu is open and a close button appears; Settings > Touch controls (auto / on / off).
TOUCH    Fullscreen with landscape lock on first tap; a "turn your phone sideways" screen in portrait; no zoom, scroll, text selection or tap highlight.
PWA      Manifest link, apple-touch-icon and service-worker registration injected only when served over http(s), so the file still opens cleanly by double-click.
PWA      Install button on the title and pause screens when Android offers installation; update notice when a new version has been cached.
PWA      Separate files: manifest.webmanifest, sw.js (cache-first with background refresh for the game and icons, network-first for the manifest), procedural chakra icons 192, 512 and maskable 512.
KEYS     Angel guide moved from G to U (G summons a vahana).
NOT DONE Ground-chunk merging (tier A still issues about 250 draws with shadows), ETC2/ASTC compression (textures are small; a runtime encoder would cost more load time than it saves), global mediump, raymarched clouds, volumetric waterfalls.
